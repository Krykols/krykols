<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Servicios | Krykols</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow-x: hidden;
            background: #000;
            font-family: 'Segoe UI', -apple-system, sans-serif;
            color: #fff;
        }

        /* ============================================
           FONDO CON PARTÍCULAS (SUBIENDO) - MÁS GRANDES
           ============================================ */
        #particles-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            overflow: hidden;
        }

.particle {
    position: absolute;
    width: 2px;
    height: 2px;
    background: rgba(255, 255, 255, 0.9);
    border-radius: 50%;
    animation: rise linear infinite;
    box-shadow: 
        0 0 10px rgba(255, 255, 255, 0.8),
        0 0 20px rgba(255, 255, 255, 0.5),
        0 0 30px rgba(255, 255, 255, 0.3);
}

/* Rastro principal */
.particle::before {
    content: '';
    position: absolute;
    top: 100%;
    left: 50%;
    transform: translateX(-50%);
    width: 2px;
    height: 60px;
    background: linear-gradient(
        to bottom,
        rgba(255, 255, 255, 0.7) 0%,
        rgba(255, 255, 255, 0.4) 40%,
        transparent 100%
    );
    border-radius: 2px;
    filter: blur(2px);
}

/* Rastro secundario (más difuso) */
.particle::after {
    content: '';
    position: absolute;
    top: 100%;
    left: 50%;
    transform: translateX(-50%);
    width: 2px;
    height: 80px;
    background: linear-gradient(
        to bottom,
        rgba(255, 255, 255, 0.3) 0%,
        transparent 100%
    );
    border-radius: 4px;
    filter: blur(1px);
}

        @keyframes rise {
            0% {
                transform: translateY(100vh);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-100vh);
                opacity: 0;
            }
        }

        @keyframes trail {
            0% {
                transform: scale(1);
                opacity: 0.8;
            }
            100% {
                transform: scale(3);
                opacity: 0;
            }
        }

        /* ============================================
           CONTENIDO PRINCIPAL
           ============================================ */
        #main-content {
            position: relative;
            z-index: 10;
            min-height: 100vh;
        }

        /* Header */
        .header {
            position: fixed;
            top: 2rem;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            text-align: center;
            width: 100%;
        }

        .header h1 {
            font-size: clamp(1.5rem, 3vw, 2.5rem);
            font-weight: 450;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            margin-bottom: 0.5rem;
        }

        .header .subtitle {
            font-size: 0.875rem;
            color: #666;
            letter-spacing: 0.2em;
        }

        /* Back button */
        .back-link {
            position: fixed;
            top: 2rem;
            left: 2rem;
            z-index: 100;
            color: #fff;
            text-decoration: none;
            font-size: 0.875rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            opacity: 0.6;
            transition: opacity 0.3s ease;
        }

        .back-link:hover {
            opacity: 1;
        }

        /* ============================================
           SECCIÓN PRINCIPAL
           ============================================ */
        .services-section {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 12rem 2rem 4rem;
            position: relative;
        }

        /* ============================================
   PORTAFOLIOS DECORATIVOS DE FONDO (SOLO PC)
   ============================================ */
.background-briefcases {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;  /* No interfieren con clicks */
    z-index: 0;
}

.bg-briefcase {
    position: absolute;
    width: 700px;
    opacity: 0.5;  /* Más transparentes para no distraer */
    transform: translateY(200px);  /* Más arriba que el principal */
}

.bg-briefcase-left {
    left: -100px;
    top: 50px;
}

.bg-briefcase-right {
    right: -100px;
    top: 50px;
}

.bg-briefcase .briefcase-container {
    background: rgba(0, 0, 0, 0.2);
    border: 2px solid rgba(255, 255, 255, 0.6);
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
}

.bg-briefcase .briefcase-lid {
    height: 270px;
    background: rgba(26, 26, 26, 0.3);
}

.bg-briefcase .briefcase-handle {
    width: 140px;
    height: 40px;
    border: 4px solid rgba(255, 255, 255, 0.5);
    top: -40px;
}

.bg-briefcase .briefcase-interior {
    min-height: 300px;
    background: rgba(10, 10, 10, 0.3);
}

.bg-briefcase .latch {
    width: 40px;
    height: 20px;
    background: linear-gradient(to bottom, #999 0%, #666 100%);
}

/* Ocultar en móvil */
@media (max-width: 768px) {
    .background-briefcases {
        display: none;
    }
}

        /* ============================================
           MALETÍN PORTFOLIO
           ============================================ */
        .portfolio-briefcase {
            width: 100%;
            max-width: 900px;
            position: relative;
            transform-style: preserve-3d;
            perspective: 2000px;
        }

        /* Contenedor del maletín - FONDO TRANSPARENTE */
        .briefcase-container {
            position: relative;
            width: 100%;
            background: rgba(0, 0, 0, 0.1);
            border: 3px solid #4b4b4b;
            border-radius: 12px;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.9);
            overflow: visible;
            backdrop-filter: blur(5px);
        }

        /* Tapa superior - SIN ANIMACIÓN DE ROTACIÓN */
.briefcase-lid {
    position: relative;
    height: 200px;
    background: #a7a7a733;
    border-bottom: 2px solid #333;
    transform-origin: top center;
    /* transform: rotateX(0deg); ← QUITA O COMENTA ESTA LÍNEA */
    /* transition: transform 1.5s... ← QUITA O COMENTA ESTA LÍNEA */
    z-index: 60;
    backdrop-filter: blur(5px);
}

/* Comenta o quita esto también */
/*
.portfolio-briefcase.open .briefcase-lid {
    transform: rotateX(-105deg);
}
*/

        /* Agarradera - HACIA AFUERA */
        .briefcase-handle {
            position: absolute;
            top: -50px;
            left: 50%;
            transform: translateX(-50%);
            width: 180px;
            height: 50px;
            border: 6px solid #ffffffb2;
            border-bottom: none;
            border-radius: 30px 30px 0 0;
            background: rgba(0, 0, 0, 0.1);
            box-shadow: 0 -5px 20px rgba(255, 255, 255, 0.3);
            z-index: 60;
        }

        /* Broches de seguridad */
        .briefcase-latches {
            position: absolute;
            bottom: 7px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 100px;
        }

        .latch {
            width: 50px;
            height: 25px;
            background: linear-gradient(to bottom, #ccc 0%, #999 100%);
            border-radius: 4px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.6);
            position: relative;
        }

        .latch::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 12px;
            height: 12px;
            background: #333;
            border-radius: 50%;
        }

        /* Interior del maletín */
        .briefcase-interior {
            position: relative;
            min-height: 500px;
            background: rgba(10, 10, 10, 0.4);
            padding: 3rem;
            backdrop-filter: blur(5px);
        }

        /* Bolsillos organizadores */
        .organizer-pockets {
            position: absolute;
            top: 2rem;
            left: 2rem;
            right: 2rem;
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 1rem;
            opacity: 0;
            transition: opacity 0.5s ease 0.5s;
        }

        .portfolio-briefcase.open .organizer-pockets {
            opacity: 0.3;
        }

        .pocket {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            height: 80px;
        }

        .pocket-small {
            height: 60px;
        }

        /* ============================================
           REVISTAS APILADAS
           ============================================ */
        .magazines-container {
            position: relative;
            width: 100%;
            height: 400px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .magazine {
            position: absolute;
            width: 300px;
            height: 300px;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.8);
            cursor: pointer;
            transition: all 0.6s cubic-bezier(0.25, 1, 0.5, 1);
            transform-style: preserve-3d;
            opacity: 0;
            transform: translateY(50px) rotateY(0deg);
        }

        .magazine.visible {
            opacity: 1;
            transform: translateY(0) rotateY(0deg);
        }

        .magazine:hover {
            transform: translateY(-10px) scale(1.05);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.9);
            z-index: 100 !important;
                border-color: #ffffff; /* Se vuelve blanco brillante al hacer hover */
    box-shadow: 0 0 20px rgba(255, 255, 255, 0.5); /* Efecto de brillo */
        }

/* IZQUIERDA: 3 revistas apiladas verticalmente */
.magazine:nth-child(1) {  /* Filigrana */
    left: calc(50% - 420px);
    top: 0px;
    z-index: 1;
}

.magazine:nth-child(2) {  /* Legal */
    left: calc(50% - 285px);
    top: 35px;
    z-index: 2;
}

.magazine:nth-child(3) {  /* IA Legal */
    left: calc(50% - 150px);
    top: 70px;
    z-index: 3;
}

.magazine:nth-child(4) {  /* Quién Soy */
    left: calc(50% - 5px);
    top: 105px;
    z-index: 4;
}

.magazine:nth-child(5) {  /* Redes */
    left: calc(50% + 140px);
    top: 140px;
    z-index: 5;
}
        /* Portada de revista */
        .magazine-cover {
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: top center;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 2rem;
        }

        .magazine-cover::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(to bottom, transparent 40%, rgba(0, 0, 0, 0.95) 100%);
        }

        .magazine-header {
            position: relative;
            z-index: 1;
            margin-bottom: auto;
            padding-top: 2rem;
        }

        .magazine-brand {
            font-size: 0.75rem;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 0.5rem;
        }

        .magazine-title {
            position: relative;
            z-index: 1;
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: #fff;
            text-shadow: 0 4px 15px rgba(0, 0, 0, 0.9);
            line-height: 1.2;
        }

        .magazine-number {
            position: absolute;
            top: 1.5rem;
            right: 1.5rem;
            font-size: 0.875rem;
            color: rgba(255, 255, 255, 0.6);
            z-index: 1;
        }

/* Imágenes de portadas */
.magazine[data-service="filigrana"] .magazine-cover {
    background: 
        linear-gradient(to bottom, transparent 40%, rgba(66, 66, 66, 0.95) 100%),
        url('assets/images/filigrana.png');
    background-size: cover;
    background-position: top center;
}

.magazine[data-service="legal"] .magazine-cover {
    background: 
        linear-gradient(to bottom, transparent 40%, rgba(8, 0, 78, 0.95) 100%),
        url('assets/images/legal.png');
    background-size: cover;
    background-position: top center ;
}

.magazine[data-service="ia-legal"] .magazine-cover {
    background: 
        linear-gradient(to bottom, transparent 40%, rgba(0, 68, 80, 0.95) 100%),
        url('assets/images/ia-legal.png');
    background-size: cover;
    background-position: top center;
}

.magazine[data-service="quien-soy"] .magazine-cover {
    background: 
        linear-gradient(to bottom, transparent 40%, rgba(66, 0, 0, 0.95) 100%),
        url('assets/images/quien-soy.jpg');
    background-size: cover;
    background-position: center;
}

.magazine[data-service="redes"] .magazine-cover {
    background: 
        linear-gradient(to bottom, transparent 40%, rgba(61, 0, 80, 0.99) 100%),
        url('assets/images/redes.jpg');
    background-size: cover;
    background-position: center;
}

/* Bordes independientes para cada revista */
.magazine[data-service="filigrana"] {
    border: 2px solid #949494;  /* Dorado */
}

.magazine[data-service="legal"] {
    border: 2px solid #284bb4;  /* Azul */
}

.magazine[data-service="ia-legal"] {
    border: 2px solid #2ba0b4;  /* Verde */
}

.magazine[data-service="quien-soy"] {
    border: 2px solid #a72727;  /* Rosa */
}

.magazine[data-service="redes"] {
    border: 2px solid #6a2ea3;  /* Púrpura */
}

        /* ============================================
           MODAL DE DETALLES
           ============================================ */
        .service-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 200;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
            padding: 2rem;
        }

        .service-modal.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            max-width: 900px;
            width: 100%;
            background: linear-gradient(135deg, #111 0%, #1a1a1a 100%);
            border: 1px solid #464646;
            border-radius: 12px;
            overflow: hidden;
            transform: scale(0.9) translateY(50px);
            transition: transform 0.5s ease;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.9);
        }

        .service-modal.active .modal-content {
            transform: scale(1) translateY(0);
        }

        .modal-header {
            height: 350px;
            background-size: cover;
            background-position: top center;
            position: relative;
        }

        .modal-header::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 150px;
            background: linear-gradient(to top, #131313d3 0%, transparent 100%);
        }

        .modal-body {
            padding: 3rem;
            position: relative;
            margin-top: -100px;
        }

        .modal-title {
            font-size: clamp(2rem, 4vw, 3rem);
            font-weight: 300;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            margin-bottom: 1.5rem;
            color: #fff;
        }

        .modal-description {
            font-size: 1.1rem;
            color: #aaa;
            line-height: 1.9;
            margin-bottom: 2.5rem;
        }

        .modal-button {
            display: inline-block;
            padding: 1.25rem 3.5rem;
            background: #fff;
            color: #000;
            text-decoration: none;
            font-weight: 600;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            border-radius: 4px;
            transition: all 0.3s ease;
            border: 2px solid #fff;
            font-size: 0.875rem;
        }

        .modal-button:hover {
            background: transparent;
            color: #fff;
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(255, 255, 255, 0.2);
        }

        .modal-close {
            position: absolute;
            top: 2rem;
            right: 2rem;
            width: 50px;
            height: 50px;
            background: rgba(255, 0, 0, 0.247);
            border: 2px solid #fff;
            border-radius: 50%;
            color: #fff;
            font-size: 2rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            z-index: 10;
        }

        .modal-close:hover {
            background: #fff;
            color: #000;
            transform: rotate(90deg);
        }

        /* ============================================
           VERSIÓN MÓVIL
           ============================================ */
        @media (max-width: 768px) {
            .services-section {
                padding: 10rem 1.5rem 3rem;
            }

            .briefcase-handle {
                width: 140px;
                height: 40px;
                border-width: 5px;
                top: -45px;
            }

            .briefcase-lid {
                height: 150px;
            }

            .briefcase-interior {
                min-height: 900px;
                padding: 1rem 1rem;
            }

            .organizer-pockets {
                display: none;
            }

            .magazines-container {
                height: 990px;
                flex-direction: column;
                gap: 1rem;
            }

            .magazine {
                position: relative !important;
                left: auto !important;
                top: auto !important;
                width: 100%;
                max-width: 600px;
                height: 200px;
                opacity: 0;
                transform: translateY(50px);
                border: 1px solid rgba(255, 255, 255, 0.4); /* Borde blanco fino */
                margin-top: -40px; /* ← CAMBIA ESTO. Número más negativo = más solapamiento hacia arriba */
            }

            .magazine.visible {
                transform: translateY(0);
            }

            .magazine-title {
                font-size: 1.25rem;
            }

            .modal-header {
                height: 250px;
            }

            .modal-body {
                padding: 2rem 1.5rem;
                margin-top: -60px;
            }

            .modal-title {
                font-size: 1.75rem;
            }

            .modal-description {
                font-size: 1rem;
            }
        }

        /* Footer */
        .footer {
            text-align: center;
            padding: 3rem 2rem;
            color: #444;
            font-size: 0.875rem;
            letter-spacing: 0.1em;
            position: relative;
            z-index: 10;
        }
    </style>
</head>

                <h2 class="modal-title" id="modalTitle"></h2>
                <p class="modal-description" id="modalDescription"></p>
                <a href="#" class="modal-button" id="modalButton">Explorar servicio</a>
            </div>
        </div>
    </div>

    <script>
        // ============================================
        // DATOS DE SERVICIOS
        // ============================================
const servicesData = {
    'filigrana': {
        title: 'Joyas de Filigrana',
        brand: 'Krykols',
        gradient: 'linear-gradient(135deg, #FFD700 0%, #FFA500 50%, #FF8C00 100%)',
        image: 'assets/images/filigrana.png',  // ← AGREGA ESTO
        description: 'Arte tradicional en oro y plata que trasciende generaciones...',
        button: 'Ver colección completa',
        link: '/servicios/filigrana'
    },
    'legal': {
        title: 'Consultoría Legal',
        brand: 'Krykols',
        gradient: 'linear-gradient(135deg, #4169E1 0%, #1E3A8A 50%, #1E40AF 100%)',
        image: 'assets/images/legal.png',  // ← AGREGA ESTO
        description: 'Asesoramiento jurídico integral...',
        button: 'Agendar consulta',
        link: '/servicios/consultoria-legal'
    },
    'ia-legal': {
        title: 'IA Legal Open Source',
        brand: 'Krykols',
        gradient: 'linear-gradient(135deg, #10B981 0%, #059669 50%, #047857 100%)',
        image: 'assets/images/ia-legal.png',  // ← AGREGA ESTO
        description: 'Revoluciona tu práctica legal...',
        button: 'Explorar herramientas',
        link: '/servicios/ia-legal'
    },
    'quien-soy': {
        title: 'Quién Soy',
        brand: 'Krykols',
        gradient: 'linear-gradient(135deg, #EC4899 0%, #BE185D 50%, #9D174D 100%)',
        image: 'assets/images/quien-soy.jpg',  // ← AGREGA ESTO
        description: 'Soy un profesional apasionado...',
        button: 'Conocer más',
        link: '/quien-soy'
    },
    'redes': {
        title: 'Redes',
        brand: 'Krykols',
        gradient: 'linear-gradient(135deg, #8B5CF6 0%, #7C3AED 50%, #6D28D9 100%)',
        image: 'assets/images/redes.jpg',  // ← AGREGA ESTO
        description: 'Explora mi trabajo...',
        button: 'Ver proyectos',
        link: '/redes'
    }
};
        // ============================================
        // VARIABLES GLOBALES
        // ============================================
        const portfolioBriefcase = document.getElementById('portfolioBriefcase');
        const serviceModal = document.getElementById('serviceModal');
        let hasOpened = false;
        const magazines = document.querySelectorAll('.magazine');

        // ============================================
        // SISTEMA DE PARTÍCULAS
        // ============================================
        function createParticles() {
            const container = document.getElementById('particles-container');
            const particleCount = 40;

            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.animationDuration = (Math.random() * 2 + 0.5) + 's';
                particle.style.animationDelay = Math.random() * 4 + 's';
                particle.style.opacity = Math.random() * 0.9 + 0.2;
                container.appendChild(particle);
            }
        }

        // ============================================
        // APERTURA DEL MALETÍN
        // ============================================
        function openBriefcase() {
            if (hasOpened) return;
            hasOpened = true;

            portfolioBriefcase.classList.add('open');

            // Mostrar revistas secuencialmente cada 1 segundo
            showMagazinesSequentially();
        }

        // Mostrar revistas una por una cada 1 segundo
        function showMagazinesSequentially() {
            magazines.forEach((magazine, index) => {
                setTimeout(() => {
                    magazine.classList.add('visible');
                }, index * 1000);
            });
        }

        // ============================================
        // SCROLL Y TOUCH EVENTS
        // ============================================
        window.addEventListener('scroll', () => {
            if (window.scrollY > 150 && !hasOpened) {
                openBriefcase();
            }
        });

        let touchStartY = 0;

        document.addEventListener('touchstart', (e) => {
            touchStartY = e.touches[0].clientY;
        });

        document.addEventListener('touchmove', (e) => {
            const touchY = e.touches[0].clientY;
            const touchDiff = touchY - touchStartY;

            if (touchDiff < -50 && !hasOpened) {
                openBriefcase();
            }
        });

        // ============================================
        // CLICK EN REVISTAS
        // ============================================
        magazines.forEach(magazine => {
            magazine.addEventListener('click', function() {
                const serviceName = this.dataset.service;
                openModal(serviceName);
            });
        });
function openModal(serviceName) {
    const service = servicesData[serviceName];
    if (!service) return;

    // Usar imagen si existe, si no usar gradiente como respaldo
    const modalHeader = document.getElementById('modalHeader');
    
    if (service.image) {
        modalHeader.style.background = `
            linear-gradient(to bottom, transparent 30%, rgba(17, 17, 17, 1) 100%),
            url('${service.image}')
        `;
        modalHeader.style.backgroundSize = 'cover';
        modalHeader.style.backgroundPosition = 'top center';
    } else {
        modalHeader.style.background = service.gradient;
    }
    
    document.getElementById('modalTitle').textContent = service.title;
    document.getElementById('modalDescription').textContent = service.description;
    document.getElementById('modalButton').textContent = service.button;
    document.getElementById('modalButton').href = service.link;

    serviceModal.classList.add('active');
    document.body.style.overflow = 'hidden';
}

        function closeModal() {
            serviceModal.classList.remove('active');
            document.body.style.overflow = '';
        }

        // Cerrar al hacer click fuera
        serviceModal.addEventListener('click', function(e) {
            if (e.target === serviceModal) {
                closeModal();
            }
        });

        // Cerrar con tecla ESC
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape' && serviceModal.classList.contains('active')) {
                closeModal();
            }
        });

// ============================================
// INICIALIZAR
// ============================================
createParticles();

// Función para mostrar revistas (universal)
function initializeMagazines() {
    if (window.innerWidth <= 768) {
        // MÓVIL: Usar IntersectionObserver
        const observerOptions = {
            threshold: 0.1,
            rootMargin: '0px 0px -50px 0px'
        };

        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('visible');
                }
            });
        }, observerOptions);

        magazines.forEach(magazine => {
            observer.observe(magazine);
        });
    } else {
        // PC: Mostrar secuencialmente
        setTimeout(() => {
            showMagazinesSequentially();
        }, 1000);
    }
}

// Iniciar después de que cargue la página
window.addEventListener('load', () => {
    initializeMagazines();
});

// También intentar después de un tiempo por si acaso
setTimeout(() => {
    if (!hasOpened && window.innerWidth > 768) {
        showMagazinesSequentially();
    }
}, 1500);
    </script>
</body>
</html>
