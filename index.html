<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarjeta 3D - Partículas</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0a;
            overflow: hidden;
            font-family: 'Segoe UI', sans-serif;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            font-size: 1.5rem;
            z-index: 1000;
            text-align: center;
        }

        .controls {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            display: flex;
            gap: 1rem;
        }

        button {
            background: #fff;
            color: #0a0a0a;
            border: none;
            padding: 0.75rem 2rem;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        button:hover {
            background: #fff;
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(226, 192, 68, 0.4);
        }
    </style>
</head>
<body>

    <div id="canvas-container"></div>
    
    <div class="controls">
        <button onclick="explode()">💥 Explotar</button>
        <button onclick="assemble()">✨ Armar</button>
    </div>

    <div class="loading" id="loading">Cargando SVG...</div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

    <script>
        // Configuración
        const config = {
            particleSize: 1.44,
            particleCount: 30000,
            assembleDuration: 3,
            explodeDuration: 2,
            svgPath: 'assets/images/Tarjeta-de-presentación-Detras.svg',
            svgWidth: 512,
            svgHeight: 512
        };

        let scene, camera, renderer, particles;
        let targetPositions = [];
        let particlesMesh;
        let isLoaded = false;

        // Inicializar Three.js
        function init() {
            const container = document.getElementById('canvas-container');
            
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a0a0a);

            camera = new THREE.PerspectiveCamera(
                75,
                window.innerWidth / window.innerHeight,
                0.1,
                1000
            );
            camera.position.z = 500;

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            container.appendChild(renderer.domElement);

            // Cargar SVG y crear partículas
            loadSVGAndCreateParticles();

            // Animar
            animate();

            // Resize
            window.addEventListener('resize', onWindowResize);
        }

        // Cargar SVG desde archivo
        async function loadSVGAndCreateParticles() {
            try {
                const response = await fetch(config.svgPath);
                const svgText = await response.text();
                
                const parser = new DOMParser();
                const svgDoc = parser.parseFromString(svgText, 'image/svg+xml');
                const svgElement = svgDoc.documentElement;
                
                // Obtener dimensiones del SVG
                const width = parseInt(svgElement.getAttribute('width')) || config.svgWidth;
                const height = parseInt(svgElement.getAttribute('height')) || config.svgHeight;
                
                // Crear canvas temporal
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                canvas.width = width;
                canvas.height = height;
                
                // Convertir SVG a imagen
                const svgBlob = new Blob([svgText], {type: 'image/svg+xml;charset=utf-8'});
                const url = URL.createObjectURL(svgBlob);
                
                const img = new Image();
                img.onload = () => {
                    ctx.drawImage(img, 0, 0, width, height);
                    URL.revokeObjectURL(url);
                    
                    // Extraer puntos del canvas
                    extractPointsFromCanvas(ctx, width, height);
                    
                    document.getElementById('loading').style.display = 'none';
                    isLoaded = true;
                    
                    // Auto-ensamblar después de 500ms
                    setTimeout(assemble, 500);
                };
                img.onerror = () => {
                    document.getElementById('loading').textContent = 'Error: No se pudo cargar el SVG';
                    console.error('Error loading SVG');
                };
                img.src = url;
                
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('loading').textContent = 'Error cargando SVG. Usa Live Server.';
            }
        }

        // Extraer puntos del canvas
        function extractPointsFromCanvas(ctx, width, height) {
            const imageData = ctx.getImageData(0, 0, width, height);
            const data = imageData.data;
            const points = [];

            // Muestrear píxeles
            const step = 1; // Menor = más partículas
            for (let y = 0; y < height; y += step) {
                for (let x = 0; x < width; x += step) {
                    const index = (y * width + x) * 4;
                    const alpha = data[index + 3];

                    if (alpha > 128) {
                        const r = data[index];
                        const g = data[index + 1];
                        const b = data[index + 2];
                        const color = new THREE.Color(r / 255, g / 255, b / 255);

                        // Centrar en (0, 0) y escalar
                        const scaleFactor = 400 / Math.max(width, height);
                        points.push({
                            x: (x - width / 2) * scaleFactor,
                            y: -(y - height / 2) * scaleFactor,
                            z: 0,
                            color: color
                        });
                    }
                }
            }

            // Limitar número de partículas
            if (points.length > config.particleCount) {
                const step2 = Math.floor(points.length / config.particleCount);
                const sampled = [];
                for (let i = 0; i < points.length; i += step2) {
                    sampled.push(points[i]);
                }
                createParticleSystem(sampled);
            } else {
                createParticleSystem(points);
            }
        }

        // Crear sistema de partículas
        function createParticleSystem(points) {
            targetPositions = points.map(p => new THREE.Vector3(p.x, p.y, p.z));
            
            // Posiciones iniciales aleatorias (explodidas)
            const initialPositions = targetPositions.map(() => {
                const radius = 400 + Math.random() * 200;
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.random() * Math.PI;
                return new THREE.Vector3(
                    radius * Math.sin(phi) * Math.cos(theta),
                    radius * Math.sin(phi) * Math.sin(theta),
                    radius * Math.cos(phi)
                );
            });

            // Geometría
            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(initialPositions.length * 3);
            const colors = new Float32Array(initialPositions.length * 3);

            initialPositions.forEach((pos, i) => {
                positions[i * 3] = pos.x;
                positions[i * 3 + 1] = pos.y;
                positions[i * 3 + 2] = pos.z;

                const color = points[i]?.color || new THREE.Color(0xe2c044);
                colors[i * 3] = color.r;
                colors[i * 3 + 1] = color.g;
                colors[i * 3 + 2] = color.b;
            });

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            // Material
            const material = new THREE.PointsMaterial({
                size: config.particleSize,
                vertexColors: true,
                transparent: true,
                opacity: 0.9,
                blending: THREE.AdditiveBlending
            });

            // Mesh
            particlesMesh = new THREE.Points(geometry, material);
            scene.add(particlesMesh);
        }

        // Animar partículas a posición objetivo
        function animateToTargets(targets, duration) {
            if (!particlesMesh) return;
            
            const positions = particlesMesh.geometry.attributes.position.array;
            const startPos = positions.slice();

            // Interpolar manualmente
            const startTime = Date.now();
            function interpolate() {
                const elapsed = (Date.now() - startTime) / 1600;
                const progress = Math.min(elapsed / duration, 1);
                
                // Easing suave
                const eased = progress < 0.5 
                    ? 2 * progress * progress 
                    : 1 - Math.pow(-2 * progress + 2, 2) / 2;

                for (let i = 0; i < targets.length; i++) {
                    positions[i * 3] = startPos[i * 3] + (targets[i].x - startPos[i * 3]) * eased;
                    positions[i * 3 + 1] = startPos[i * 3 + 1] + (targets[i].y - startPos[i * 3 + 1]) * eased;
                    positions[i * 3 + 2] = startPos[i * 3 + 2] + (targets[i].z - startPos[i * 3 + 2]) * eased;
                }

                particlesMesh.geometry.attributes.position.needsUpdate = true;

                if (progress < 1) {
                    requestAnimationFrame(interpolate);
                }
            }
            interpolate();
        }

        // Explotar
        function explode() {
            if (!particlesMesh) return;
            
            const positions = particlesMesh.geometry.attributes.position.array;
            const currentTargets = [];
            
            // Guardar posiciones actuales
            for (let i = 0; i < targetPositions.length; i++) {
                currentTargets.push(new THREE.Vector3(
                    positions[i * 3],
                    positions[i * 3 + 1],
                    positions[i * 3 + 2]
                ));
            }

            // Generar nuevas posiciones aleatorias
            const newPositions = currentTargets.map(() => {
                const radius = 300 + Math.random() * 300;
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.random() * Math.PI;
                return new THREE.Vector3(
                    radius * Math.sin(phi) * Math.cos(theta),
                    radius * Math.sin(phi) * Math.sin(theta),
                    radius * Math.cos(phi)
                );
            });

            animateToTargets(newPositions, config.explodeDuration);
        }

        // Armar
        function assemble() {
            if (!particlesMesh) return;
            animateToTargets(targetPositions, config.assembleDuration);
        }

        // Animación continua
        function animate() {
            requestAnimationFrame(animate);
            
            // Rotación suave
            if (particlesMesh) {
                particlesMesh.rotation.y += 0.01;
            }
            
            renderer.render(scene, camera);
        }

        // Resize
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // Iniciar
        init();
    </script>
</body>
</html>
