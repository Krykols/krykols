<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Redes Sociales | Krykols Terminal</title>
    
    <!-- FUENTE ROBOTO (Tipografía oficial de YouTube) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow-x: hidden;
            background: #000;
            font-family: 'Roboto', sans-serif;
            color: #fff;
        }

        #bg-particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            background: radial-gradient(circle at center, #0a1510 0%, #000000 100%);
        }

        #main-content {
            position: relative;
            z-index: 10;
            min-height: 100vh;
            padding: 2rem 1rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .status-bar {
            width: 100%;
            max-width: 800px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.75rem 1rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 4px;
            margin-bottom: 3rem;
            font-size: 0.75rem;
            letter-spacing: 0.1em;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: #2bff00;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; box-shadow: 0 0 10px rgba(0, 255, 106, 0.8); }
            50% { opacity: 0.4; box-shadow: 0 0 5px rgba(0, 255, 191, 0.4); }
        }

        .time-display {
            color: #fff;
            font-weight: 700;
        }

        .page-title {
            text-align: center;
            margin-bottom: 4rem;
        }

        .page-title h1 {
            font-size: clamp(2rem, 5vw, 3.5rem);
            font-weight: 900;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: #fff;
            text-shadow: 0 0 20px rgba(255, 254, 254, 0.6);
            margin-bottom: 1rem;
        }

        .page-title p {
            font-size: 0.875rem;
            color: rgba(255, 255, 255, 0.6);
            letter-spacing: 0.2em;
            font-weight: 500;
        }

        .bubbles-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 3rem;
            width: 100%;
            max-width: 800px;
            justify-items: center;
            padding: 2rem 0;
        }

        .bubble {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            background: rgba(21, 255, 0, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(8px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            text-decoration: none;
            color: #ffffffbd;
            position: relative;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            animation: float 6s ease-in-out infinite;
        }

        /* Clase para burbujas con imagen de fondo */
        .bubble.with-image {
            background-color: rgba(0, 0, 0, 0.603);
            background-size: cover;
            background-position: center;
            background-blend-mode: multiply;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .bubble:nth-child(1) { animation-delay: 0s; }
        .bubble:nth-child(2) { animation-delay: 1.2s; }
        .bubble:nth-child(3) { animation-delay: 2.4s; }
        .bubble:nth-child(4) { animation-delay: 0.8s; }
        .bubble:nth-child(5) { animation-delay: 1.8s; }
        .bubble:nth-child(6) { animation-delay: 3.0s; }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
        }

        .bubble svg {
            width: 50px;
            height: 50px;
            transition: all 0.3s ease;
        }

        .bubble[data-network="youtube"] svg { fill: #FF0000; }
        .bubble[data-network="twitch"] svg { fill: #9146FF; }
        .bubble[data-network="facebook"] svg { fill: #1877F2; }
        .bubble[data-network="blog"] svg { fill: #FFFFFF; }

        .bubble-label {
            position: absolute;
            bottom: -40px;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: #00ffbf;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.3s ease;
            white-space: nowrap;
        }

        .bubble:hover {
            transform: translateY(-30px) scale(1.1);
            animation-play-state: paused;
        }

        .bubble:hover svg {
            transform: scale(1.15);
            filter: drop-shadow(0 0 8px currentColor);
        }

        .bubble:hover .bubble-label {
            opacity: 1;
            transform: translateY(0);
        }

        .bubble[data-network="youtube"]:hover { 
            border-color: #FF0000; 
            box-shadow: 0 0 30px rgba(255, 0, 0, 0.4), inset 0 0 20px rgba(255, 0, 0, 0.1); 
        }
        .bubble[data-network="youtube"]:hover .bubble-label { color: #FF0000; }

        .bubble[data-network="twitch"]:hover { 
            border-color: #9146FF; 
            box-shadow: 0 0 30px rgba(145, 70, 255, 0.4), inset 0 0 20px rgba(145, 70, 255, 0.1); 
        }
        .bubble[data-network="twitch"]:hover .bubble-label { color: #9146FF; }

        .bubble[data-network="instagram"]:hover { 
            border-color: #E1306C; 
            box-shadow: 0 0 30px rgba(225, 48, 108, 0.4), inset 0 0 20px rgba(225, 48, 108, 0.1); 
        }
        .bubble[data-network="instagram"]:hover .bubble-label { color: #E1306C; }
        
        .bubble.with-image:hover {
            background-color: rgba(0, 0, 0, 0.6);
        }

        .bubble[data-network="facebook"]:hover { 
            border-color: #1877F2; 
            box-shadow: 0 0 30px rgba(24, 119, 242, 0.4), inset 0 0 20px rgba(24, 119, 242, 0.1); 
        }
        .bubble[data-network="facebook"]:hover .bubble-label { color: #1877F2; }

        .bubble[data-network="blog"]:hover { 
            border-color: #FFFFFF; 
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.4), inset 0 0 20px rgba(255, 255, 255, 0.1); 
        }
        .bubble[data-network="blog"]:hover .bubble-label { color: #FFFFFF; }

        .terminal-footer {
            text-align: center;
            padding: 4rem 1rem 2rem;
            margin-top: auto;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            width: 100%;
            max-width: 800px;
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.5);
            letter-spacing: 0.2em;
        }

        .back-link {
            position: fixed;
            top: 2rem;
            left: 2rem;
            z-index: 100;
            color: #fff;
            text-decoration: none;
            font-size: 0.875rem;
            font-weight: 700;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            opacity: 0.6;
            transition: opacity 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 0.5rem 1rem;
            background: rgba(255, 255, 255, 0.05);
        }

        .back-link:hover {
            opacity: 1;
            border-color: #00ffbf;
            color: #00ffbf;
            box-shadow: 0 0 10px rgba(0, 255, 191, 0.4);
        }

        @media (max-width: 768px) {
            .bubbles-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 4rem 2rem;
            }
            
            .bubble {
                width: 120px;
                height: 120px;
            }
            
            .bubble svg {
                width: 40px;
                height: 40px;
            }

            .back-link {
                top: 1rem;
                left: 1rem;
                font-size: 0.75rem;
            }
        }

        @media (max-width: 400px) {
            .bubbles-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

    <script>
        function updateTime() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            document.getElementById('timeDisplay').textContent = `${hours}:${minutes}:${seconds}`;
        }
        setInterval(updateTime, 1000);
        updateTime();

        window.addEventListener('load', () => {
            const bubbles = document.querySelectorAll('.bubble');
            bubbles.forEach((bubble, index) => {
                bubble.style.opacity = '0';
                bubble.style.transform = 'translateY(50px)';
                
                setTimeout(() => {
                    bubble.style.transition = 'all 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
                    bubble.style.opacity = '1';
                    bubble.style.transform = 'translateY(0)';
                }, index * 150);
            });
        });
    </script>
