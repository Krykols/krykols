<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>¿Quién Soy? | Krykols</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Comic+Neue:wght@400;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --comic-yellow: #ffeb3b;
            --comic-red: #e53935;
            --comic-blue: #ffeb3b;
            --comic-black: #1a1a1a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: 'Comic Neue', cursive;
        }

        /* ============================================
           FONDO CON BLUR DE LA PORTADA (FIJO)
           ============================================ */
        .bg-blur {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('../assets/images/portada.png');
            background-size: cover;
            background-position: center;
            filter: blur(30px) brightness(0.3);
            z-index: 0;
            transform: scale(1.1);
        }

        /* ============================================
           BOTÓN VOLVER (Solo visible en portada)
           ============================================ */
        .back-btn {
            position: fixed;
            top: 1rem;
            left: 1rem;
            background: var(--comic-blue);
            color: #000000;
            border: 3px solid var(--comic-black);
            padding: 0.6rem 1.2rem;
            font-family: 'Bangers', cursive;
            font-size: 1.1rem;
            text-decoration: none;
            letter-spacing: 0.05em;
            box-shadow: 3px 3px 0 var(--comic-black);
            border-radius: 4px;
            z-index: 1000;
            transition: all 0.3s ease;
        }

        .back-btn:hover {
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0 var(--comic-black);
        }

        .back-btn.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transform: translate(-20px, 0);
        }

        /* ============================================
           CONTENEDOR CENTRAL DEL LIBRO (CORREGIDO)
           ============================================ */
        .book-center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: min(90vw, 500px);
            /* 
               CORRECCIÓN CLAVE: 
               100vh menos 150px (75px para el botón superior + 75px para los controles inferiores).
               Esto garantiza la MÁXIMA altura posible sin solapamiento.
            */
            height: calc(100vh - 150px);
            max-height: 80vh;
            display: flex;
            align-items: center;
            justify-content: center;
            perspective: 2500px;
        }

        /* ============================================
           PORTADA
           ============================================ */
        .cover-wrapper {
            position: absolute;
            width: 100%;
            height: 100%;
            aspect-ratio: 5 / 7;
            cursor: pointer;
            transform-style: preserve-3d;
            transform-origin: left center;
            transition: transform 1s cubic-bezier(0.645, 0.045, 0.355, 1), visibility 0.5s ease 0.5s, opacity 0.5s ease 0.5s;
            z-index: 100;
        }

        .cover-wrapper.opened {
            transform: rotateY(-180deg);
            pointer-events: none;
            opacity: 0;
            visibility: hidden;
        }

        .cover-front {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            border-radius: 4px 12px 12px 4px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
            overflow: hidden;
            background: transparent;
        }

        .cover-front img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        .cover-hint {
            position: absolute;
            bottom: -45px;
            left: 50%;
            transform: translateX(-50%);
            color: var(--comic-yellow);
            font-family: 'Bangers', cursive;
            font-size: 1.2rem;
            letter-spacing: 0.1em;
            text-shadow: 2px 2px 0 var(--comic-black);
            animation: bounce 2s infinite;
            white-space: nowrap;
            pointer-events: none;
        }

        @keyframes bounce {
            0%, 100% { transform: translateX(-50%) translateY(0); }
            50% { transform: translateX(-50%) translateY(-10px); }
        }

        /* ============================================
           ESCENARIO DEL LIBRO (1 PÁGINA A LA VEZ)
           ============================================ */
        .book-stage {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            align-items: center;
            justify-content: center;
            perspective: 2000px;
            z-index: 50;
        }

        .book-stage.visible {
            display: flex;
        }

        .current-page-image {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 4px 12px 12px 4px;
            background: transparent;
            user-select: none;
            -webkit-user-drag: none;
            transition: visibility 0.1s;
        }

        /* ============================================
           ANIMACIÓN DE PASAR PÁGINA (1 en 1)
           ============================================ */
        .turning-page {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
            transform-origin: left center;
            transition: transform 0.8s cubic-bezier(0.645, 0.045, 0.355, 1);
            z-index: 60;
            will-change: transform;
        }

        .turning-page.flipped {
            transform: rotateY(-180deg);
        }

        .page-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            background: transparent;
            border-radius: 4px 12px 12px 4px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .page-face img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        .page-face.back {
            transform: rotateY(180deg);
            border-radius: 12px 4px 4px 12px;
        }

        /* ============================================
           CONTROLES DE NAVEGACIÓN
           ============================================ */
        .nav-controls {
            position: fixed;
            bottom: 1rem;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 0.8rem;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transition: opacity 0.4s ease, visibility 0.4s;
        }

        .nav-controls.visible {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
        }

        .nav-btn {
            background: var(--comic-yellow);
            color: var(--comic-black);
            border: 3px solid var(--comic-black);
            padding: 0.7rem 1rem;
            font-family: 'Bangers', cursive;
            font-size: 1rem;
            letter-spacing: 0.05em;
            cursor: pointer;
            box-shadow: 3px 3px 0 var(--comic-black);
            transition: all 0.15s ease;
            text-transform: uppercase;
            border-radius: 4px;
        }

        .nav-btn:hover:not(:disabled) {
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0 var(--comic-black);
        }

        .nav-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            transform: none;
            box-shadow: 3px 3px 0 var(--comic-black);
        }

        .page-indicator {
            background: var(--comic-black);
            color: var(--comic-yellow);
            padding: 0.7rem 0.8rem;
            font-family: 'Bangers', cursive;
            font-size: 1rem;
            letter-spacing: 0.1em;
            border-radius: 4px;
            min-width: 70px;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .close-btn {
            position: fixed;
            top: 1rem;
            right: 1rem;
            background: var(--comic-red);
            color: #fff;
            border: 3px solid var(--comic-black);
            width: 45px;
            height: 45px;
            font-family: 'Bangers', cursive;
            font-size: 1.5rem;
            cursor: pointer;
            box-shadow: 3px 3px 0 var(--comic-black);
            border-radius: 50%;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .close-btn.visible {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
        }

        .close-btn:hover {
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0 var(--comic-black);
        }

        /* ============================================
           MODO MÓVIL (Optimizaciones específicas)
           ============================================ */
        @media (max-width: 768px) {
            .book-center {
                width: 100vw;
                /* En móvil, restamos solo 130px para maximizar la imagen al límite */
                height: calc(100vh - 85px);
                max-height: none;
            }
            
            .nav-controls {
                bottom: 0.8rem;
                gap: 0.6rem;
                width: 96%;
                justify-content: center;
            }
            
            .nav-btn {
                padding: 0.8rem 0.5rem;
                font-size: 0.95rem;
                flex: 1;
                max-width: 130px;
            }

            .page-indicator {
                padding: 0.7rem 0.5rem;
                min-width: 60px;
                font-size: 0.95rem;
            }

            .back-btn {
                top: 0.8rem;
                left: 0.8rem;
                padding: 0.5rem 0.9rem;
                font-size: 1rem;
            }

            .close-btn {
                top: 0.8rem;
                right: 0.8rem;
                width: 40px;
                height: 40px;
                font-size: 1.3rem;
            }
            
            .cover-hint {
                font-size: 1.1rem;
                bottom: -40px;
            }
        }
    </style>
</head>
<body>

    <!-- Fondo con blur de la portada (fijo) -->
    <div class="bg-blur"></div>

    <!-- Botón Volver (Solo visible en portada) -->
    <a href="../services.html" class="back-btn" id="backBtn">◀ Volver</a>

    <!-- Contenedor del libro -->
    <div class="book-container" id="bookContainer">
        
        <!-- Centro dinámico del libro -->
        <div class="book-center">
            
            <!-- Portada -->
            <div class="cover-wrapper" id="cover" onclick="openBook()">
                <div class="cover-front">
                    <img src="../assets/images/portada.png" alt="Portada ¿Quién Soy?">
                </div>
                <div class="cover-hint">▼ TOCA PARA ABRIR ▼</div>
            </div>

            <!-- Escenario del libro (1 página a la vez) -->
            <div class="book-stage" id="bookStage">
                <img class="current-page-image" id="currentPageImg" src="" alt="Página actual">
            </div>
            
        </div>
    </div>

    <!-- Botón Cerrar (Solo visible durante la lectura) -->
    <button class="close-btn" id="closeBtn" onclick="closeBook()" aria-label="Cerrar libro">✕</button>

    <!-- Controles de navegación -->
    <div class="nav-controls" id="navControls">
        <button class="nav-btn" id="prevBtn" onclick="prevPage()">◀ Anterior</button>
        <div class="page-indicator" id="pageIndicator">1 / 1</div>
        <button class="nav-btn" id="nextBtn" onclick="nextPage()">Siguiente ▶</button>
    </div>

    <script>
        // ============================================
        // CONFIGURACIÓN
        // ============================================
        const TOTAL_PAGES = 8; // ← Cambia esto al número total de páginas
        const IMAGE_PATH = '../assets/images/quiensoy/pag';

        // Estado
        let currentPage = 1;
        let isAnimating = false;
        let bookOpened = false;

        // Referencias DOM
        const cover = document.getElementById('cover');
        const bookStage = document.getElementById('bookStage');
        const currentPageImg = document.getElementById('currentPageImg');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const pageIndicator = document.getElementById('pageIndicator');
        const navControls = document.getElementById('navControls');
        const closeBtn = document.getElementById('closeBtn');
        const backBtn = document.getElementById('backBtn');

        // ============================================
        // ABRIR LIBRO
        // ============================================
        function openBook() {
            if (bookOpened || isAnimating) return;
            isAnimating = true;

            cover.classList.add('opened');

            setTimeout(() => {
                bookStage.classList.add('visible');
                currentPage = 1;
                updatePageDisplay();
                
                navControls.classList.add('visible');
                closeBtn.classList.add('visible');
                backBtn.classList.add('hidden'); 
                
                bookOpened = true;
                isAnimating = false;
            }, 800);
        }

        // ============================================
        // CERRAR LIBRO
        // ============================================
        function closeBook() {
            if (isAnimating) return;
            isAnimating = true;

            bookStage.classList.remove('visible');
            navControls.classList.remove('visible');
            closeBtn.classList.remove('visible');
            
            backBtn.classList.remove('hidden');

            setTimeout(() => {
                cover.classList.remove('opened');
                bookOpened = false;
                isAnimating = false;
            }, 100);
        }

        // ============================================
        // ACTUALIZAR VISUALIZACIÓN
        // ============================================
        function updatePageDisplay() {
            currentPageImg.src = `${IMAGE_PATH}${currentPage}.png`;
            pageIndicator.textContent = `${currentPage} / ${TOTAL_PAGES}`;
            
            prevBtn.disabled = currentPage === 1;
            nextBtn.disabled = currentPage === TOTAL_PAGES;
        }

        // ============================================
        // PASAR PÁGINA (SIGUIENTE) - SIN DUPLICADOS
        // ============================================
        function nextPage() {
            if (isAnimating || currentPage >= TOTAL_PAGES) return;
            isAnimating = true;

            const nextPageNum = currentPage + 1;

            // CORRECCIÓN DEFINITIVA: Ocultar completamente la imagen estática durante el giro
            currentPageImg.style.visibility = 'hidden';

            const turningPage = document.createElement('div');
            turningPage.className = 'turning-page';

            const frontFace = document.createElement('div');
            frontFace.className = 'page-face front';
            const frontImg = document.createElement('img');
            frontImg.src = `${IMAGE_PATH}${currentPage}.png`;
            frontFace.appendChild(frontImg);

            const backFace = document.createElement('div');
            backFace.className = 'page-face back';
            const backImg = document.createElement('img');
            backImg.src = `${IMAGE_PATH}${nextPageNum}.png`;
            backFace.appendChild(backImg);

            turningPage.appendChild(frontFace);
            turningPage.appendChild(backFace);
            bookStage.appendChild(turningPage);

            // Forzar reflow
            void turningPage.offsetWidth;

            requestAnimationFrame(() => {
                turningPage.classList.add('flipped');
            });

            setTimeout(() => {
                turningPage.remove();
                currentPage = nextPageNum;
                updatePageDisplay();
                // Restaurar la visibilidad de la imagen estática (ahora con la nueva página)
                currentPageImg.style.visibility = 'visible';
                isAnimating = false;
            }, 800);
        }

        // ============================================
        // PASAR PÁGINA (ANTERIOR) - SIN DUPLICADOS
        // ============================================
        function prevPage() {
            if (isAnimating || currentPage <= 1) return;
            isAnimating = true;

            const prevPageNum = currentPage - 1;

            // CORRECCIÓN DEFINITIVA: Ocultar completamente la imagen estática durante el giro
            currentPageImg.style.visibility = 'hidden';

            const turningPage = document.createElement('div');
            turningPage.className = 'turning-page flipped';

            const frontFace = document.createElement('div');
            frontFace.className = 'page-face front';
            const frontImg = document.createElement('img');
            frontImg.src = `${IMAGE_PATH}${prevPageNum}.png`;
            frontFace.appendChild(frontImg);

            const backFace = document.createElement('div');
            backFace.className = 'page-face back';
            const backImg = document.createElement('img');
            backImg.src = `${IMAGE_PATH}${currentPage}.png`;
            backFace.appendChild(backImg);

            turningPage.appendChild(frontFace);
            turningPage.appendChild(backFace);
            bookStage.appendChild(turningPage);

            void turningPage.offsetWidth;

            requestAnimationFrame(() => {
                turningPage.classList.remove('flipped');
            });

            setTimeout(() => {
                turningPage.remove();
                currentPage = prevPageNum;
                updatePageDisplay();
                currentPageImg.style.visibility = 'visible';
                isAnimating = false;
            }, 800);
        }

        // ============================================
        // NAVEGACIÓN CON TECLADO
        // ============================================
        document.addEventListener('keydown', (e) => {
            if (!bookOpened) {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    openBook();
                }
                return;
            }
            if (e.key === 'ArrowRight' || e.key === 'd') nextPage();
            if (e.key === 'ArrowLeft' || e.key === 'a') prevPage();
            if (e.key === 'Escape') closeBook();
        });

        // ============================================
        // NAVEGACIÓN CON SWIPE (Móvil)
        // ============================================
        let touchStartX = 0;
        let touchEndX = 0;

        document.addEventListener('touchstart', (e) => {
            touchStartX = e.changedTouches[0].screenX;
        }, { passive: true });

        document.addEventListener('touchend', (e) => {
            touchEndX = e.changedTouches[0].screenX;
            handleSwipe();
        }, { passive: true });

        function handleSwipe() {
            if (!bookOpened || isAnimating) return;
            const swipeThreshold = 50;
            const diff = touchStartX - touchEndX;

            if (Math.abs(diff) < swipeThreshold) return;

            if (diff > 0) nextPage();
            else prevPage();
        }

        // ============================================
        // PRE-CARGA DE IMÁGENES
        // ============================================
        for (let i = 1; i <= TOTAL_PAGES; i++) {
            const img = new Image();
            img.src = `${IMAGE_PATH}${i}.png`;
        }
    </script>
</body>
</html>
